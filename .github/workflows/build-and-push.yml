name: Build and Push Images

on:
  workflow_call:
    inputs:
      matrix:
        description: "Matrix of images to build"
        required: true
        type: string
      runner:
        description: "Runner label (ubuntu-latest default, or arc-runners for Talos self-hosted)"
        required: false
        type: string
        default: 'ubuntu-latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      # For FlakeHub Cache (Determinate) — GitHub OIDC bearer.
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Self-hosted runners (nixtop NixOS, Talos arc-runner-nix) ship nix with a
      # WARM STORE — use it (fast, cache hits) and skip the installer, which on
      # NixOS conflicts with the system nix daemon and ignores the warm store.
      # ubuntu-latest has no nix, so the installer runs there.
      - name: Detect pre-installed Nix (warm store)
        run: |
          if command -v nix >/dev/null 2>&1; then
            echo "Using pre-installed Nix: $(nix --version)"
            echo "NIX_PREINSTALLED=true" >> "$GITHUB_ENV"
            echo "NIX_INSTALLED=true" >> "$GITHUB_ENV"
          fi

      - name: Install Nix
        if: env.NIX_PREINSTALLED != 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Mark Nix installed
        if: env.NIX_PREINSTALLED != 'true'
        run: echo "NIX_INSTALLED=true" >> $GITHUB_ENV

      # (FlakeHub Cache removed — it requires FlakeHub org registration /
      # OIDC-linking this org doesn't have, so the action hard-errored
      # "registration required" and broke builds even under continue-on-error.
      # Attic below is the shared-closure cache; re-add FlakeHub only after the
      # org is linked at flakehub.com.)

      # Self-hosted (Talos) Attic cache — in-cluster, fast. The runner image
      # ships attic-client and the ARC template sets ATTIC_SERVER_URL/ATTIC_TOKEN.
      # `attic use` wires it as a nix substituter (pull); we push after the build.
      # No-op on ubuntu runners (no attic client / no token) so it never breaks
      # the GitHub-hosted path.
      - name: Configure Attic cache (self-hosted)
        run: |
          if command -v attic >/dev/null 2>&1 && [ -n "${ATTIC_TOKEN:-}" ] && [ -n "${ATTIC_SERVER_URL:-}" ]; then
            attic login nc "$ATTIC_SERVER_URL" "$ATTIC_TOKEN" 2>/dev/null \
              && attic use nc:nixcontainers 2>/dev/null \
              && { echo "ATTIC_READY=true" >> "$GITHUB_ENV"; echo "Attic substituter enabled (nc:nixcontainers)"; } \
              || echo "Attic login/use failed; continuing without cache"
          else
            echo "Attic not available on this runner; skipping (expected on ubuntu-latest)"
          fi

      # No docker/dind: nix2container's copyTo pushes straight to the registry
      # via skopeo, which reads ~/.docker/config.json. Write that auth file
      # directly (replaces docker/login-action, which needs a docker daemon).
      # Skip on PR — the token can't push packages it didn't create.
      - name: Registry auth for skopeo (nix2container)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          auth=$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)
          printf '{"auths":{"%s":{"auth":"%s"}}}' '${{ env.REGISTRY }}' "$auth" > ~/.docker/config.json
          echo "wrote registry auth for ${{ env.REGISTRY }}"

      - name: Build nix2container image
        if: env.NIX_INSTALLED == 'true'
        run: |
          # Source Nix environment
          . /nix/var/nix/profiles/default/etc/profile.d/nix.sh 2>/dev/null || true
          # Build image using Nix flakes with explicit experimental features
          nix --extra-experimental-features "nix-command flakes" build .#"${{ matrix.name }}" --print-build-logs
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV

      # Push the freshly-built closure to Attic so sibling images sharing these
      # store paths (base layers, common deps) skip rebuilding them next time.
      # Best-effort — a cache push must never fail the build/publish.
      - name: Push build closure to Attic
        if: env.ATTIC_READY == 'true' && env.BUILD_SUCCESS == 'true'
        continue-on-error: true
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix.sh 2>/dev/null || true
          attic push nc:nixcontainers ./result 2>/dev/null \
            && echo "pushed ${{ matrix.name }} closure to Attic" \
            || echo "attic push skipped/failed (non-fatal)"

      - name: Push image to registry (nix2container copyTo)
        # copyTo pushes the OCI image straight to the registry via skopeo — no
        # docker daemon, no dind. Each extra tag is a cheap re-copy (existing
        # blobs are skipped). PR runs skip the push (see auth step above).
        if: env.NIX_INSTALLED == 'true' && env.BUILD_SUCCESS == 'true' && github.event_name != 'pull_request'
        run: |
          . /nix/var/nix/profiles/default/etc/profile.d/nix.sh 2>/dev/null || true
          set -euo pipefail
          nix_run() { nix --extra-experimental-features "nix-command flakes" "$@"; }
          nix_eval() { nix --extra-experimental-features "nix-command flakes" eval --raw "$@" 2>/dev/null; }
          REGISTRY_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}"

          # Resolve the upstream version tag: getPackageVersion, then legacy
          # Labels/imageTag, then "latest".
          PACKAGE_VERSION=$(nix_run eval --raw --impure --expr \
            "(import ./lib/versions.nix { pkgs = import (builtins.getFlake (toString ./.)).inputs.nixpkgs { system = builtins.currentSystem; config.allowUnfree = true; }; }) \"${{ matrix.name }}\"" 2>/dev/null || true)
          if [ -z "${PACKAGE_VERSION:-}" ] || [ "$PACKAGE_VERSION" = "latest" ]; then
            PACKAGE_VERSION=$(nix_eval ".#\"${{ matrix.name }}\".config.Labels.\"org.opencontainers.image.version\"" \
              || nix_eval ".#\"${{ matrix.name }}\".imageTag" || echo "latest")
          fi
          PACKAGE_VERSION="${PACKAGE_VERSION//+/-}"   # docker tags disallow '+'
          echo "Package version: $PACKAGE_VERSION"
          REF_TAG="${{ github.ref_name }}"; REF_TAG="${REF_TAG//\//-}"

          copy() { echo "-> docker://$1"; nix_run run .#"${{ matrix.name }}".copyTo -- "docker://$1"; }
          copy "${REGISTRY_URL}:latest"
          copy "${REGISTRY_URL}:${{ github.sha }}"
          if [ "$PACKAGE_VERSION" != "latest" ]; then copy "${REGISTRY_URL}:$PACKAGE_VERSION"; fi
          if [ "${{ github.ref_name }}" != "main" ]; then copy "${REGISTRY_URL}:$REF_TAG"; fi
          echo "pushed ${{ matrix.name }}"


      - name: Build Summary
        if: always()
        run: |
          echo "=== Build Summary for ${{ matrix.name }} ==="
          if [ "$NIX_INSTALLED" = "true" ]; then
            echo "✅ Nix installation: SUCCESS"
          else
            echo "❌ Nix installation: FAILED"
          fi
          
          if [ "$BUILD_SUCCESS" = "true" ]; then
            echo "✅ Container build: SUCCESS"
          elif [ "$NIX_INSTALLED" = "true" ]; then
            echo "❌ Container build: FAILED"
          else
            echo "⏭️ Container build: SKIPPED (Nix not available)"
          fi