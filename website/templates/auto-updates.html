<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-updates (last 24h) — nix-containers</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{BASE}}static/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{BASE}}static/favicon/favicon-16.png">
  <link rel="icon" type="image/x-icon" href="{{BASE}}static/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="{{BASE}}static/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="{{BASE}}static/css/site.css">
  <script>window.SITE_BASE = "{{BASE}}";</script>
</head>
<body class="bg-bg-base text-fg-primary min-h-screen">
  <header class="border-b border-neutral-800 bg-bg-elevated">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-3xl font-bold font-mono text-accent-ok">
            <a href="{{BASE}}" class="hover:opacity-90">nix-containers</a>
          </h1>
          <p class="text-fg-muted mt-1">Auto-updates in the last 24 hours</p>
        </div>
        <nav class="flex items-center gap-4 text-sm">
          <a href="{{BASE}}" class="text-fg-muted hover:text-fg-primary">Home</a>
          <a href="{{BASE}}charts/" class="text-fg-muted hover:text-fg-primary">Charts</a>
          <a href="{{BASE}}packages/" class="text-fg-muted hover:text-fg-primary">Packages</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="card mb-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <div class="text-2xl font-bold font-mono text-accent-ok" id="pr-count">–</div>
          <div class="text-sm text-fg-muted">Auto-update PRs</div>
        </div>
        <div>
          <div class="text-2xl font-bold font-mono text-accent-ok" id="bump-count">–</div>
          <div class="text-sm text-fg-muted">Packages bumped</div>
        </div>
        <div>
          <div class="text-2xl font-bold font-mono text-accent-ok" id="unique-count">–</div>
          <div class="text-sm text-fg-muted">Unique packages</div>
        </div>
        <div>
          <div class="text-2xl font-bold font-mono text-accent-ok" id="window-hours">24h</div>
          <div class="text-sm text-fg-muted">Window</div>
        </div>
      </div>
      <p class="text-xs text-fg-muted mt-4">
        Sourced from merged PRs on
        <a href="https://github.com/nix-containers/images/pulls?q=is%3Amerged+deps"
           class="underline">nix-containers/images</a>
        matched by <code>deps:</code> / <code>chore(deps)</code> / <code>auto-update</code>
        / <code>automated package</code>.
      </p>
    </div>

    <div id="content" class="space-y-6">
      <p class="text-fg-muted">Loading…</p>
    </div>
  </main>

  <script src="{{BASE}}static/auto-updates.js"></script>
</body>
</html>
